name: smart_money_ashare
description: >
  A-share "smart money" confirmation on liquid main+ChiNext names: rising
  margin balance, analyst coverage that is at least half Buy/Overweight,
  no pledge overhang, insiders not net sellers, and price above the 60-day
  mean.  Northbound (沪深港通) holdings are a CONFIRMATION leg with
  na_pass: the exchanges stopped publishing per-stock northbound holdings
  in 2026-09, so the leg judges names while the data lives and steps aside
  (with a loud staleness warning) once it is gone -- it must not veto the
  whole screen.  Pledge and insider legs read "no KNOWN overhang / no
  known net selling": a name without the file passes (na_pass), a name
  with the data must clear the bar.  Margin and analyst coverage stay
  strict -- a smart-money screen without them is not one.

universe:
  boards: [main, chinext]
  exclude_st: true
  min_listed_days: 365

filters:
  - {name: liquid,     expr: "amount_ma20 >= 2e8"}
  - {name: northbound, expr: "nb_hold_chg_20d > 0 and nb_hold_chg_60d > 0", na_pass: true}
  - {name: margin,     expr: "margin_chg_20d > 0"}
  - {name: analysts,   expr: "report_cnt_90d >= 2 and buy_report_ratio_90d >= 0.5"}
  - {name: pledge,     expr: "pledge_ratio < 0.30", na_pass: true}
  - {name: insiders,   expr: "insider_net_180d_mc > -0.001", na_pass: true}
  - {name: trend,      expr: "ma_ratio_60 > 1"}

rank:
  - {expr: "pct_rank(margin_chg_20d)",  weight: 1.0}
  - {expr: "pct_rank(nb_hold_chg_20d)", weight: 0.5}
  - {expr: "pct_rank(mom_63s21)",       weight: 0.5}

top_n: 20
