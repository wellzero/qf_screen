name: quality_growth
description: >
  Profitable growers at a reasonable price, on the lxg statement subset:
  TTM revenue and profit growth above 15%, measured against a base that
  was already profitable (the TTM report known a year earlier earned a
  net margin of at least 8%) and backed by operating cash flow; ROE above
  12%, gross margin above 20%, debt under 60% of assets, P/E under 40 but
  positive.  Growth is CAPPED at +/-100% for ranking, so a turnaround off
  a thin base cannot take the top ranks on the strength of one percentage.
  Statement fields cover only the lxg finance subset.

universe:
  boards: [a_share]
  exclude_st: true
  min_listed_days: 365

filters:
  - {name: liquid,   expr: "amount_ma20 >= 1e8"}
  - {name: growth,   expr: "rev_growth > 0.15 and profit_growth > 0.15"}
  # base-effect guard: growth off a near-zero profit base (a prior-year net
  # margin of a few per cent) is a turnaround, not growth -- the 2,000%+
  # names that used to head this list all sat here
  - {name: base,     expr: "net_margin_py >= 0.08"}
  # cash-backed: the profit growth shows up in operating cash flow
  - {name: cash,     expr: "ocf_ttm > 0"}
  - {name: quality,  expr: "roe > 0.12 and gross_margin > 0.20"}
  - {name: balance,  expr: "debt_assets < 0.6"}
  - {name: price,    expr: "pe_ttm > 0 and pe_ttm < 40"}

rank:
  - {expr: "pct_rank(clip(rev_growth, -1, 1))",    weight: 1.0}
  - {expr: "pct_rank(clip(profit_growth, -1, 1))", weight: 1.0}
  - {expr: "pct_rank(roe)",                        weight: 0.5}

top_n: 30
