name: low_pcf_cash_value
description: >
  Operating-cash value: a positive price-to-cash-flow under 15 (the
  market median sits near 13), an implied-or-statement ROE above 10%,
  non-financial, and no more than 30% below the 52-week high so the
  cheap cash flow is not a collapsing one.  pcf_ttm is a full-market
  vendor snapshot (NaN where omitted, and NaN fails).  Ranked by cash
  yield (1/PCF) with a quality tilt.

universe:
  boards: [a_share]
  exclude_st: true
  min_listed_days: 365

filters:
  - {name: liquid,      expr: "amount_ma20 >= 1e8"}
  - {name: cheap_cash,  expr: "pcf_ttm > 0 and pcf_ttm < 15"}
  - {name: quality,     expr: "roe_best > 0.10"}
  - {name: not_financial, expr: "fillna(financial, 0) < 0.5"}
  - {name: not_falling, expr: "high252_ratio >= 0.70"}

rank:
  - {expr: "pct_rank(1 / pcf_ttm)", weight: 1.0}
  - {expr: "pct_rank(roe_best)",    weight: 1.0}

top_n: 30
max_per_industry: 5
